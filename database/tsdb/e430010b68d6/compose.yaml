services:
  e43-ruby:
    container_name: 'e43-ruby'
    build: .
    tty: true
    working_dir: '/workspace/myapp'
    volumes:
      - ./:/workspace/myapp
    depends_on:
      - e43-influxdb
    environment:
      INFLUX_URL: http://e43-influxdb:8086
      INFLUXDB_ORGANIZATION: baseorg
      INFLUXDB_BUCKET: basebucket
      INFLUXDB_INSECURE: true
      INFLUXDB_TOKEN: M5jOEwL4BKBUzE8g==Dv7YNoeNZyGZUxMk8pVDXUKprmIuy48Y9Zsyw7zNnlZ7pHG16FYbsNbpbPbP6kK_qEzNaq
    entrypoint: |
      bash -e -c "
      bundle install
      /bin/bash
      "

  e43-influxdb:
    container_name: 'e43-influxdb'
    image: influxdb:2.7.5-alpine
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminadmin
      DOCKER_INFLUXDB_INIT_ORG: baseorg
      DOCKER_INFLUXDB_INIT_BUCKET: basebucket
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: M5jOEwL4BKBUzE8g==Dv7YNoeNZyGZUxMk8pVDXUKprmIuy48Y9Zsyw7zNnlZ7pHG16FYbsNbpbPbP6kK_qEzNaq
